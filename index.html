<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sforzameanings · Guía de tarot</title>
  <meta name="description" content="Sforzameanings · Guía profesional de significados de tarot: baraja española, Rider-Waite y Marsella." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="pre-auth">

  <!-- ═══════════════════════════════════════════════════════
       LOGIN OVERLAY (visible por defecto, hasta que haya sesión)
       ═══════════════════════════════════════════════════════ -->
  <div id="loginOverlay" class="open">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-brand-name">Sforzameanings</span>
        <span class="login-brand-tag">Guía profesional de tarot</span>
      </div>

      <form id="loginForm" class="login-form" autocomplete="on">
        <label>
          Email
          <input type="email" id="loginEmail" required autocomplete="username" placeholder="tu@correo.com" />
        </label>
        <label>
          Contraseña
          <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <button type="submit" id="loginBtn">Entrar</button>
        <p id="loginMsg" class="login-msg"></p>
      </form>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       TOPBAR
       ═══════════════════════════════════════════════════════ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph">✦</span>
      <span>Sforzameanings</span>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-view="consulta">Consulta</button>
      <button class="nav-btn" data-view="biblioteca">Biblioteca</button>
      <button class="nav-btn" data-view="historial">Historial</button>
      <span id="userLabel" class="user-label" style="display:none"></span>
      <button id="logoutBtn" class="nav-btn ghost">Cerrar sesión</button>
    </nav>
  </header>

  <!-- ═══════════════════════════════════════════════════════
       CONTENIDO
       ═══════════════════════════════════════════════════════ -->
  <main class="container">

    <!-- VISTA: CONSULTA -->
    <section id="view-consulta" class="view active">
      <div class="deck-bar" id="deckBar"></div>

      <div class="spread-controls">
        <button id="addCardBtn" class="btn">+ Añadir carta</button>
        <button id="clearBtn" class="btn ghost small">Limpiar todas</button>
        <span class="hint" id="counter">0 cartas seleccionadas</span>
      </div>

      <div class="reading-board" id="readingBoard"></div>

      <div class="meanings-header">
        <h2>Significados</h2>
        <span class="hint">Usa ⟲ para invertir una carta · ✕ para quitarla</span>
      </div>
      <div class="meanings" id="meanings"></div>

      <div class="note-save-bar">
        <div class="note-field">
          <label for="readingNote">Nota del tarotista (opcional)</label>
          <textarea id="readingNote" rows="3" placeholder="Escribe aquí tus apuntes sobre esta lectura... (puedes dejarlo vacío)"></textarea>
        </div>
        <button id="saveBtn" class="btn">Guardar lectura</button>
      </div>
    </section>

    <!-- VISTA: BIBLIOTECA -->
    <section id="view-biblioteca" class="view">
      <h2 class="view-title">Biblioteca de cartas</h2>
      <div class="library-toolbar">
        <input type="search" id="libSearch" placeholder="Buscar carta..." />
        <select id="libDeck"></select>
        <select id="libSuit"><option value="">Todos los palos</option></select>
      </div>
      <div class="library-grid" id="libraryGrid"></div>
    </section>

    <!-- VISTA: HISTORIAL -->
    <section id="view-historial" class="view">
      <h2 class="view-title">Historial de lecturas</h2>
      <div id="historyList" class="history-list"></div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════════════
       MODAL: SELECTOR DE CARTA
       ═══════════════════════════════════════════════════════ -->
  <div class="modal-backdrop" id="pickerModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="pickerTitle">Elegir carta</h3>
        <button class="close-btn" data-close="pickerModal">✕</button>
      </div>
      <div class="picker-toolbar">
        <input type="search" id="pickerSearch" placeholder="Buscar carta..." />
        <select id="pickerSuit"><option value="">Todos los palos</option></select>
      </div>
      <div class="picker-grid" id="pickerGrid"></div>
    </div>
  </div>

  <!-- Toast (avisos elegantes) -->
  <div id="sforzaToast" class="sforza-toast"></div>

  <!-- ═══════════════════════════════════════════════════════
       SCRIPTS
       ═══════════════════════════════════════════════════════ -->
  <script src="data/espanola.js"></script>
  <script src="data/rider-waite.js"></script>
  <script src="data/marsella.js"></script>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
